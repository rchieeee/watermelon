name: watermelon_irrigation
description: Irrigation monitoring and decision support for a watermelon field.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: '>=0.19.0 <0.21.0'
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
